# fly.toml app configuration file generated for canvas-mcp-franklin on 2026-05-12T17:39:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'canvas-mcp-franklin'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENABLE_DATA_ANONYMIZATION = 'true'
  LOG_REDACT_PII = 'true'
  MCP_BIND_HOST = '0.0.0.0'
  MCP_BIND_PORT = '8000'
  MCP_TRANSPORT = 'http'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
